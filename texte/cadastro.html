<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema de Logística e Armazenamento</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --accent-dark: #2563eb;
            --light: #f8fafc;
            --dark: #0a0f1c;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: #334155;
            --card-bg: rgba(30, 41, 59, 0.8);
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, var(--primary) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background-color: rgba(15, 23, 42, 0.95);
            padding: 1.2rem 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--success) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.3rem;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4);
        }

        .logo h1 {
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--light);
            letter-spacing: -0.5px;
        }

        .logo span {
            background: linear-gradient(90deg, var(--accent-light), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .page {
            flex: 1;
            padding: 2.5rem 0;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            margin-bottom: 2rem;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--success), var(--accent));
        }

        .card-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--light);
            text-align: center;
            font-weight: 800;
            position: relative;
        }

        .card-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 5px;
            background: linear-gradient(90deg, var(--success), var(--accent));
            margin: 12px auto 0;
            border-radius: 3px;
        }

        .form-group {
            margin-bottom: 1.8rem;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 0.7rem;
            font-weight: 600;
            color: var(--text);
            font-size: 0.95rem;
        }

        .input-with-icon {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        input, select {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: rgba(15, 23, 42, 0.7);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background-color: rgba(15, 23, 42, 0.9);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 1.1rem 2rem;
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.5);
        }

        .btn-block {
            display: flex;
            width: 100%;
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary) 0%, #2d3447 100%);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-secondary:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .register-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--success) 0%, #34d399 100%);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        .register-subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .login-link {
            text-align: center;
            margin: 1.5rem 0;
        }

        .login-link a {
            color: var(--accent-light);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 1rem;
            border-radius: 12px;
            margin: 1rem 0;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .user-type-selector {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
        }

        .user-type-selector h3 {
            color: var(--accent-light);
            margin-bottom: 1rem;
            font-size: 1.1rem;
            text-align: center;
        }

        .user-type-options {
            display: flex;
            gap: 1rem;
        }

        .user-type-option {
            flex: 1;
            text-align: center;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-type-option.selected {
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }

        .user-type-option i {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .chapa-info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 1rem;
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: var(--accent-light);
        }

        .chapa-info i {
            margin-right: 0.5rem;
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            
            .card {
                padding: 1.5rem;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .user-type-options {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header id="main-header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">SLA</div>
                    <h1>Sistema de <span>Logística e Armazenamento</span></h1>
                </div>
            </div>
        </div>
    </header>

    <section class="page">
        <div class="container">
            <div class="register-container">
                <div class="card">
                    <div class="register-header">
                        <div class="register-avatar">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h2 class="card-title">Criar Nova Conta</h2>
                        <p class="register-subtitle">Preencha os dados abaixo para se cadastrar</p>
                    </div>
                    
                    <form id="register-form">
                        <div class="form-group">
                            <label for="nome">Nome Completo</label>
                            <div class="input-with-icon">
                                <i class="input-icon fas fa-user"></i>
                                <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <div class="input-with-icon">
                                <i class="input-icon fas fa-envelope"></i>
                                <input type="email" id="email" placeholder="Digite seu e-mail" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="chapa">Número da Chapa</label>
                            <div class="input-with-icon">
                                <i class="input-icon fas fa-id-card"></i>
                                <input type="text" id="chapa" placeholder="Digite seu número da chapa" required pattern="[0-9]+" title="Apenas números são permitidos">
                            </div>
                            <div class="chapa-info">
                                <i class="fas fa-info-circle"></i>
                                O número da chapa é o seu identificador único na empresa
                            </div>
                        </div>

                        <div class="user-type-selector">
                            <h3><i class="fas fa-user-tag"></i> Tipo de Usuário</h3>
                            <div class="user-type-options">
                                <div class="user-type-option selected" data-type="employee">
                                    <i class="fas fa-user"></i>
                                    <div>Funcionário</div>
                                    <small>Acesso básico</small>
                                </div>
                                <div class="user-type-option" data-type="manager">
                                    <i class="fas fa-user-tie"></i>
                                    <div>Gerente</div>
                                    <small>Acesso completo</small>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="senha">Senha</label>
                            <div class="input-with-icon">
                                <i class="input-icon fas fa-lock"></i>
                                <input type="password" id="senha" placeholder="Digite sua senha" required minlength="6">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="confirmar">Confirmar Senha</label>
                            <div class="input-with-icon">
                                <i class="input-icon fas fa-lock"></i>
                                <input type="password" id="confirmar" placeholder="Confirme sua senha" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-block">
                            <i class="fas fa-user-plus"></i>
                            <span>Cadastrar</span>
                        </button>
                    </form>

                    <div id="message" class="message"></div>

                    <div class="login-link">
                        <p>Já tem uma conta? <a href="login.html">Faça login aqui</a></p>
                    </div>

                    <div style="text-align: center;">
                        <a href="index.html" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i>
                            <span>Voltar para Início</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        let selectedUserType = 'employee';

        document.addEventListener('DOMContentLoaded', function() {
            // Configurar seleção de tipo de usuário
            document.querySelectorAll('.user-type-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.user-type-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    this.classList.add('selected');
                    selectedUserType = this.getAttribute('data-type');
                    console.log('Tipo de usuário selecionado:', selectedUserType);
                });
            });

            // Configurar formulário de cadastro
            document.getElementById('register-form').addEventListener('submit', function(e) {
                e.preventDefault();
                const nome = document.getElementById('nome').value;
                const email = document.getElementById('email').value;
                const chapa = document.getElementById('chapa').value;
                const senha = document.getElementById('senha').value;
                const confirmar = document.getElementById('confirmar').value;

                // Validações
                if (senha !== confirmar) {
                    showMessage('As senhas não coincidem!', 'error');
                    return;
                }

                if (senha.length < 6) {
                    showMessage('A senha deve ter pelo menos 6 caracteres!', 'error');
                    return;
                }

                if (!/^\d+$/.test(chapa)) {
                    showMessage('O número da chapa deve conter apenas números!', 'error');
                    return;
                }

                // Gerar username a partir do email
                const username = email.split('@')[0].toLowerCase();
                
                // Cadastrar usuário
                const newUser = {
                    id: Date.now(),
                    username: username,
                    password: senha,
                    type: selectedUserType,
                    name: nome,
                    email: email,
                    chapa: chapa,
                    createdAt: new Date().toISOString()
                };

                const users = JSON.parse(localStorage.getItem('system_users') || '[]');
                
                // Verificar se email já existe
                const userExists = users.find(u => u.email === email);
                if (userExists) {
                    showMessage('Este e-mail já está cadastrado!', 'error');
                    return;
                }

                // Verificar se username já existe
                const usernameExists = users.find(u => u.username === username);
                if (usernameExists) {
                    showMessage('Nome de usuário já existe! Tente outro e-mail.', 'error');
                    return;
                }

                // Verificar se número da chapa já existe
                const chapaExists = users.find(u => u.chapa === chapa);
                if (chapaExists) {
                    showMessage('Este número da chapa já está cadastrado!', 'error');
                    return;
                }

                users.push(newUser);
                localStorage.setItem('system_users', JSON.stringify(users));

                const userTypeText = selectedUserType === 'manager' ? 'GERENTE' : 'FUNCIONÁRIO';
                showMessage(`✅ Cadastro realizado com sucesso! Tipo: ${userTypeText} - Chapa: ${chapa}`, 'success');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
            });
        });

        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // Rolagem suave para a mensagem
            messageDiv.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
